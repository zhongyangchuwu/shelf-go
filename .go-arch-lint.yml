version: 3
workdir: internal

allow:
  depOnAnyVendor: false

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  cobra:
    in: github.com/spf13/cobra
  yaml:
    in: gopkg.in/yaml.v3
  lipgloss:
    in:
      - charm.land/lipgloss/v2
      - charm.land/lipgloss/v2/**
  atottoClipboard:
    in: github.com/atotto/clipboard
  term:
    in: golang.org/x/term
  platform:
    in:
      - golang.org/x/sys/unix
      - golang.org/x/sys/windows
  bubbletea:
    in:
      - charm.land/bubbletea/v2
      - charm.land/bubbletea/v2/**
  bubbles:
    in:
      - charm.land/bubbles/v2
      - charm.land/bubbles/v2/**
  huh:
    in:
      - charm.land/huh/v2
      - charm.land/huh/v2/**

components:
  cli:
    in: cli
  cliui:
    in: cliui
  tui:
    in: tui
  clipboard:
    in: clipboard
  app:
    in: app
  project:
    in: project
  vaultmodel:
    in: vaultmodel
  vaultjson:
    in: vaultjson
  config:
    in: config
  util:
    in: util

deps:
  cli:
    mayDependOn:
      - app
      - cliui
      - clipboard
      - tui
    canUse:
      - cobra
      - term
      - platform
  tui:
    mayDependOn:
      - app
      - clipboard
    canUse:
      - bubbletea
      - bubbles
      - huh
      - lipgloss

  cliui:
    canUse:
      - lipgloss

  clipboard:
    canUse:
      - atottoClipboard

  app:
    mayDependOn:
      - config
      - project
      - util
      - vaultmodel
      - vaultjson

  project:
    mayDependOn:
      - util
      - vaultmodel

  vaultjson:
    mayDependOn:
      - vaultmodel
      - util

  config:
    mayDependOn: []
    canUse:
      - yaml
